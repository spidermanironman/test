<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流程图图片处理器 - 背景反转 & 清晰度增强</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #e8e8ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #666;
            font-size: 1.1rem;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        
        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .option input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
        
        .option input[type="range"] {
            flex: 1;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            width: 100%;
            margin-top: 20px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .preview-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            background: #fafafa;
        }
        
        .preview-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .preview-image {
            width: 100%;
            border-radius: 8px;
            background: #ddd;
            display: block;
        }
        
        .download-btn {
            background: #28a745;
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 0.9rem;
        }
        
        .download-btn:hover {
            background: #218838;
        }
        
        .hidden {
            display: none !important;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            margin-top: 15px;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 流程图图片处理器</h1>
        <p class="subtitle">将黑色背景转为白色，文字变为对比色，提高清晰度</p>
        
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <p class="upload-text">点击或拖拽图片到此处上传</p>
                <p style="color: #999; margin-top: 10px; font-size: 0.9rem;">支持 PNG, JPG, JPEG, WebP 格式</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">
            
            <div class="options">
                <div class="option">
                    <input type="checkbox" id="enhanceSharpness" checked>
                    <label for="enhanceSharpness">增强锐度</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="upscale" checked>
                    <label for="upscale">2倍放大</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="enhanceContrast" checked>
                    <label for="enhanceContrast">增强对比度</label>
                </div>
                <div class="option">
                    <label for="contrastLevel">对比度: <span id="contrastValue">1.1</span></label>
                    <input type="range" id="contrastLevel" min="1" max="1.5" step="0.05" value="1.1">
                </div>
            </div>
            
            <button class="btn" id="processBtn" disabled>🔄 处理图片</button>
            
            <div id="status" class="status hidden"></div>
        </div>
        
        <div class="card hidden" id="resultsCard">
            <h2 style="margin-bottom: 20px; color: #333;">处理结果</h2>
            <div class="preview-grid">
                <div class="preview-card">
                    <h3>📷 原图</h3>
                    <img id="originalPreview" class="preview-image" alt="原图">
                </div>
                <div class="preview-card">
                    <h3>✨ 处理后（白色背景）</h3>
                    <img id="processedPreview" class="preview-image" alt="处理后">
                    <button class="btn download-btn" id="downloadBtn">📥 下载处理后的图片</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const resultsCard = document.getElementById('resultsCard');
        const originalPreview = document.getElementById('originalPreview');
        const processedPreview = document.getElementById('processedPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const contrastLevel = document.getElementById('contrastLevel');
        const contrastValue = document.getElementById('contrastValue');
        
        let originalImage = null;
        let processedDataUrl = null;
        
        // Contrast slider
        contrastLevel.addEventListener('input', () => {
            contrastValue.textContent = contrastLevel.value;
        });
        
        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('请上传图片文件！', true);
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    originalPreview.src = e.target.result;
                    processBtn.disabled = false;
                    showStatus(`图片已加载: ${img.width}x${img.height}`);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        processBtn.addEventListener('click', processImage);
        
        function processImage() {
            if (!originalImage) return;
            
            showStatus('正在处理图片...');
            processBtn.disabled = true;
            
            // Use setTimeout to allow UI update
            setTimeout(() => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Options
                    const shouldUpscale = document.getElementById('upscale').checked;
                    const shouldSharpen = document.getElementById('enhanceSharpness').checked;
                    const shouldContrast = document.getElementById('enhanceContrast').checked;
                    const contrastMultiplier = parseFloat(contrastLevel.value);
                    
                    // Set canvas size
                    const scale = shouldUpscale ? 2 : 1;
                    canvas.width = originalImage.width * scale;
                    canvas.height = originalImage.height * scale;
                    
                    // Draw original image (scaled if needed)
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
                    
                    // Get image data
                    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let data = imageData.data;
                    
                    // Process each pixel
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Calculate HSV-like values
                        const max = Math.max(r, g, b);
                        const min = Math.min(r, g, b);
                        const v = max; // Value
                        const s = max === 0 ? 0 : (max - min) / max * 255; // Saturation
                        
                        // Determine pixel type
                        const isDarkBg = v < 40;
                        const isGrayscale = s < 50;
                        const isLight = v > 150 && isGrayscale;
                        
                        if (isDarkBg) {
                            // Dark background -> white
                            data[i] = 255;
                            data[i + 1] = 255;
                            data[i + 2] = 255;
                        } else if (isLight) {
                            // Light gray/white elements -> dark
                            data[i] = 40;
                            data[i + 1] = 40;
                            data[i + 2] = 40;
                        } else if (isGrayscale) {
                            // Mid-gray -> invert
                            data[i] = 255 - r;
                            data[i + 1] = 255 - g;
                            data[i + 2] = 255 - b;
                        } else {
                            // Colored elements - adjust for white background
                            // Make colors slightly darker for better visibility
                            const factor = 0.8;
                            data[i] = Math.min(255, r * factor);
                            data[i + 1] = Math.min(255, g * factor);
                            data[i + 2] = Math.min(255, b * factor);
                        }
                    }
                    
                    // Apply contrast if enabled
                    if (shouldContrast) {
                        const factor = contrastMultiplier;
                        const intercept = 128 * (1 - factor);
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = clamp(data[i] * factor + intercept);
                            data[i + 1] = clamp(data[i + 1] * factor + intercept);
                            data[i + 2] = clamp(data[i + 2] * factor + intercept);
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    
                    // Apply sharpening if enabled
                    if (shouldSharpen) {
                        imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const sharpened = applySharpen(imageData);
                        ctx.putImageData(sharpened, 0, 0);
                    }
                    
                    // Get result
                    processedDataUrl = canvas.toDataURL('image/png', 1.0);
                    processedPreview.src = processedDataUrl;
                    
                    resultsCard.classList.remove('hidden');
                    showStatus(`✓ 处理完成！新尺寸: ${canvas.width}x${canvas.height}`);
                    processBtn.disabled = false;
                    
                } catch (error) {
                    showStatus('处理出错: ' + error.message, true);
                    processBtn.disabled = false;
                }
            }, 100);
        }
        
        function clamp(value) {
            return Math.max(0, Math.min(255, Math.round(value)));
        }
        
        function applySharpen(imageData) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const output = new Uint8ClampedArray(data);
            
            // Unsharp mask kernel
            const kernel = [
                0, -1, 0,
                -1, 5, -1,
                0, -1, 0
            ];
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let sum = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4 + c;
                                sum += data[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
                            }
                        }
                        const idx = (y * width + x) * 4 + c;
                        output[idx] = clamp(sum);
                    }
                }
            }
            
            return new ImageData(output, width, height);
        }
        
        function showStatus(message, isError = false) {
            status.textContent = message;
            status.classList.remove('hidden', 'error');
            if (isError) {
                status.classList.add('error');
            }
        }
        
        downloadBtn.addEventListener('click', () => {
            if (!processedDataUrl) return;
            
            const link = document.createElement('a');
            link.download = 'flowchart_processed.png';
            link.href = processedDataUrl;
            link.click();
        });
    </script>
</body>
</html>
